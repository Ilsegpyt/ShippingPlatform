services:
  api:
    image: ${DOCKER_REGISTRY-}api
    build:
      context: .
      dockerfile: Src/Api/Dockerfile
    
    volumes:
       - ./Src/Api/wwwroot/uploads:/app/wwwroot/uploads

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
  
  db-init:
    image: mcr.microsoft.com/mssql/server:2025-latest

volumes:
  sqlserver_data:

networks:
  app-network:
    driver: bridge
    name: app-network
