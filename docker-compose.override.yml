services:
  api:
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__IdentityDb: "Server=sqlserver,1433;Database=ShippingPlatform;User Id=sa;Password=${DB_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      ConnectionStrings__CustomersDb: "Server=sqlserver,1433;Database=ShippingPlatform;User Id=sa;Password=${DB_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      ConnectionStrings__NotificationsDb: "Server=sqlserver,1433;Database=ShippingPlatform;User Id=sa;Password=${DB_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      ConnectionStrings__ReportsDb: "Server=sqlserver,1433;Database=ShippingPlatform;User Id=sa;Password=${DB_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      ConnectionStrings__ContentDb: "Server=sqlserver,1433;Database=ShippingPlatform;User Id=sa;Password=${DB_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      ConnectionStrings__OperationsDb: "Server=sqlserver,1433;Database=ShippingPlatform;User Id=sa;Password=${DB_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      ConnectionStrings__WebsiteDb: "Server=sqlserver,1433;Database=ShippingPlatform;User Id=sa;Password=${DB_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Seed__SuperAdminPassword: "${SEED_SUPERADMIN_PASSWORD}"
      Jwt__SigningKey: "${JWT_SIGNING_KEY}"
      Email__Username: "${EMAIL_USERNAME}"
      Email__Password: "${EMAIL_PASSWORD}"
      Email__SmtpHost: "${EMAIL_SMTP_HOST}"
      Email__SmtpPort: "${EMAIL_SMTP_PORT}"
      Email__FromEmail: "${EMAIL_FROM_EMAIL}"
      Email__FromName: "${EMAIL_FROM_NAME}"
      Notifications__FrontendBaseUrl: "http://127.0.0.1:5173"

    networks:
      - app-network
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully

  sqlserver:
    container_name: shippingplatform-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_SA_PASSWORD}"
    restart: unless-stopped
    networks:
      - app-network
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  db-init:
    container_name: shippingplatform-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - app-network
    environment:
      DB_SA_PASSWORD: "${DB_SA_PASSWORD}"
    volumes:
      - ./database/init:/scripts:ro
    command:
      - /bin/bash
      - -c
      - |
        set -e

        run_sql() {
          /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$DB_SA_PASSWORD" -C -b -I -f 65001 "$$@"
        }

        echo "Creating database if missing..."
        run_sql -Q "IF DB_ID(N'ShippingPlatform') IS NULL CREATE DATABASE [ShippingPlatform];"

        for file in /scripts/*.sql
        do
          echo "Executing: $$file"
          run_sql -d ShippingPlatform -i "$$file"
        done

        echo "Database initialization completed successfully."
    restart: "no"